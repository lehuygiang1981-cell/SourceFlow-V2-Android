name: SourceFlow R3.4.2 Broker Filter Patch 2 APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'android_patch/**'
      - 'scripts/**'
      - '.github/workflows/sourceflow-r342-patch2.yml'
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true
      - name: Prepare Android project
        shell: pwsh
        run: ./scripts/prepare_android.ps1
      - name: Run broker filter regression tests
        shell: pwsh
        run: flutter test test/hunter_r342_filter_test.dart
      - name: Build APK release
        shell: pwsh
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SourceFlow_R342_BrokerFilter_Patch2_APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
