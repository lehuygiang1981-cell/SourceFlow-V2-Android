name: SourceFlow Personal R2.9 - Supply Hunter APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'SourceFlow_R2_9_Filter3Groups_Source.zip'
      - '.github/workflows/SourceFlow_Personal_R2_9_workflow.yml'
permissions:
  contents: read
jobs:
  build-android:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Extract R2.9 source
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath 'SourceFlow_R2_9_Filter3Groups_Source.zip' -DestinationPath '.' -Force
          if (!(Test-Path 'pubspec.yaml')) { throw 'Missing pubspec.yaml' }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Prepare Android and packages
        shell: pwsh
        run: ./scripts/prepare_android.ps1
      - name: Analyze Dart
        shell: pwsh
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Flutter tests
        shell: pwsh
        run: flutter test
      - name: Build release APK
        shell: pwsh
        run: |
          Add-Content -Path 'android/gradle.properties' -Value 'kotlin.jvm.target.validation.mode=warning'
          Add-Content -Path 'android/gradle.properties' -Value 'kotlin.incremental=false'
          flutter build apk --release
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: SourceFlow-Personal-R2.9-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
