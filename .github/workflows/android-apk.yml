name: SourceFlow V2.2 - Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Extract V2.2 source code
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath 'SourceFlow_V2_2_transfer.zip' -DestinationPath '.' -Force
          if (!(Test-Path 'pubspec.yaml')) { throw 'Missing pubspec.yaml' }
      - name: Fix V2.2 Dart syntax
        shell: pwsh
        run: |
          $p = 'lib/models.dart'
          $s = Get-Content -LiteralPath $p -Raw
          $s = $s.Replace('(?:\\s|[:=-]|$)', '(?:\\s|[:=-]|\$)')
          $s = $s.Replace('!==', '!=')
          [System.IO.File]::WriteAllText((Resolve-Path $p).Path, $s, [System.Text.UTF8Encoding]::new($false))
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Prepare Android
        shell: pwsh
        run: ./scripts/prepare_android.ps1
      - name: Test business rules
        shell: pwsh
        run: flutter test
      - name: Configure ML Kit R8 rules
        shell: pwsh
        run: |
          $rules = @(
            '-dontwarn com.google.mlkit.vision.text.chinese.**'
            '-dontwarn com.google.mlkit.vision.text.devanagari.**'
            '-dontwarn com.google.mlkit.vision.text.japanese.**'
            '-dontwarn com.google.mlkit.vision.text.korean.**'
          )
          Set-Content -Path 'android/app/proguard-rules.pro' -Value $rules -Encoding utf8
          $p = 'android/app/build.gradle.kts'
          $g = Get-Content $p -Raw
          if ($g -notmatch 'release\s*\{') { throw 'Release build configuration not found' }
          $replacement = 'release {' + [Environment]::NewLine + '            proguardFiles("proguard-rules.pro")'
          $g = [regex]::new('release\s*\{').Replace($g, $replacement, 1)
          [System.IO.File]::WriteAllText((Resolve-Path $p).Path, $g, [System.Text.UTF8Encoding]::new($false))
      - name: Build APK
        shell: pwsh
        run: |
          Add-Content -Path 'android/gradle.properties' -Value 'kotlin.jvm.target.validation.mode=warning'
          Add-Content -Path 'android/gradle.properties' -Value 'kotlin.incremental=false'
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SourceFlow-V2-2-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
